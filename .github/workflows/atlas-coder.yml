name: Atlas Coder
# Carries the dispatched task id into the run's own name. The dispatch API
# returns 204 with no body, and the runs list API exposes neither a run's
# inputs nor a task id — so without this the web app can only guess which
# run belongs to which task, by workflow and creation time. This turns that
# guess into an exact match (see apps/web/app/api/tasks/run-status.mjs).
run-name: ${{ github.workflow }} · task ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Stable Atlas task identifier
        required: true
        type: string
      repository:
        description: Repository in owner/name form
        required: true
        default: cornerstonemarketingus/atlas
        type: string
      branch:
        description: Branch to propose a change against
        required: true
        default: main
        type: string
      mode:
        description: Execution mode (this workflow only ever runs coder)
        required: true
        default: coder
        type: choice
        options:
          - coder
      objective:
        description: Human-readable task objective
        required: true
        type: string
      merge_policy:
        description: What to do with the opened PR
        required: true
        default: manual
        type: choice
        options:
          - manual
          - ci-gated
          - none
      correlation_id:
        # Optional so dispatches from before correlation ids existed, and
        # manual runs from the GitHub UI, still validate. Scripts drop any
        # value that is not exactly `cor_` + 32 lowercase hex.
        description: Atlas correlation id (cor_ + 32 lowercase hex), optional
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-coder-${{ github.event.inputs.repository }}-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 15 minutes for the model run itself, plus headroom for ci-gated's own
    # bounded poll loop (create-coder-pull-request.mjs times out that loop
    # well before this does, so it always exits cleanly instead of being
    # force-killed mid-merge-attempt).
    # A self-hosted model runs on the runner's CPU and is far slower than any
    # hosted API, so the ceiling moves when one is configured. 330 leaves a
    # margin under the 360-minute hard limit for a job.
    timeout-minutes: ${{ vars.ATLAS_SELF_HOSTED_MODEL != '' && 330 || 25 }}
    # Every checkout uses persist-credentials: false, and the push + pull
    # request step authenticates with ATLAS_GITHUB_TOKEN (see below), not
    # the default GITHUB_TOKEN — so the built-in token needs no write scope
    # here at all.
    permissions:
      contents: read
    env:
      ATLAS_TASK_ID: ${{ github.event.inputs.task_id }}
      ATLAS_REPOSITORY: ${{ github.event.inputs.repository }}
      ATLAS_BRANCH: ${{ github.event.inputs.branch }}
      ATLAS_MODE: ${{ github.event.inputs.mode }}
      ATLAS_OBJECTIVE: ${{ github.event.inputs.objective }}
      ATLAS_CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
      ATLAS_MERGE_POLICY: ${{ github.event.inputs.merge_policy }}
      ATLAS_OUTPUT_DIR: ${{ github.workspace }}/atlas-output
      ATLAS_REPOSITORY_ROOT: ${{ github.workspace }}/target
    steps:
      - name: Check out trusted runner policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cornerstonemarketingus/atlas
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Validate dispatch inputs
        run: node scripts/runner/validate-inputs.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/atlas-cli/package-lock.json

      - name: Build trusted Atlas CLI
        working-directory: packages/atlas-cli
        run: npm ci --ignore-scripts && npm run build

      - name: Check out requested branch as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cornerstonemarketingus/atlas
          ref: ${{ github.event.inputs.branch }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Install target validation dependencies
        working-directory: target/packages/atlas-cli
        run: npm ci --ignore-scripts

      # Runs a model on the runner itself instead of calling a vendor. Opt-in:
      # with ATLAS_SELF_HOSTED_MODEL unset this step is skipped entirely and
      # nothing about the job changes. See LOCAL-MODEL.md for the trade-offs —
      # it is much slower than a hosted API and, on a private repository,
      # consumes Actions minutes that are not free.
      # Unreadable usage blocks by default; explicit allow keeps UNKNOWN visible.
      - name: Check the Actions minutes budget
        if: ${{ vars.ATLAS_SELF_HOSTED_MODEL != '' }}
        env:
          GH_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
          ATLAS_BILLING_ACCOUNT: ${{ github.repository_owner }}
          ATLAS_ACTIONS_UNKNOWN_POLICY: ${{ vars.ATLAS_ACTIONS_UNKNOWN_POLICY }}
          ATLAS_ESTIMATED_RUN_MINUTES: ${{ vars.ATLAS_ESTIMATED_RUN_MINUTES }}
          ATLAS_ACTIONS_MINUTES_RESERVE: ${{ vars.ATLAS_ACTIONS_MINUTES_RESERVE }}
        run: node scripts/runner/actions-budget.mjs

      - name: Start a self-hosted model server
        if: ${{ vars.ATLAS_SELF_HOSTED_MODEL != '' }}
        env:
          SELF_HOSTED_MODEL: ${{ vars.ATLAS_SELF_HOSTED_MODEL }}
          OLLAMA_VERSION: ${{ vars.ATLAS_OLLAMA_VERSION }}
          OLLAMA_SHA256: ${{ vars.ATLAS_OLLAMA_SHA256 }}
          CONTEXT_LENGTH: ${{ vars.ATLAS_CODER_CONTEXT_WINDOW }}
        run: |
          set -euo pipefail
          if [ -z "${OLLAMA_VERSION:-}" ]; then
            echo "ATLAS_SELF_HOSTED_MODEL is set, so ATLAS_OLLAMA_VERSION must be too." >&2
            echo "Pick a tag from https://github.com/ollama/ollama/releases (e.g. v0.12.3)" >&2
            echo "and set it as a repository variable. Pinning a version is deliberate:" >&2
            echo "this job has access to the repository, and piping an unpinned remote" >&2
            echo "installer into a shell would undo the action pinning used everywhere else." >&2
            exit 1
          fi

          # Current Ollama Linux releases use zstd archives. Keeping the exact
          # asset name here makes a packaging change fail loudly rather than
          # downloading an installer script and executing it implicitly.
          archive=ollama-linux-amd64.tar.zst
          url="https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/${archive}"
          echo "Downloading $url"
          curl -fsSL --retry 3 -o "$archive" "$url"

          actual=$(sha256sum "$archive" | cut -d" " -f1)
          echo "sha256=$actual"
          if [ -n "${OLLAMA_SHA256:-}" ]; then
            if [ "$actual" != "$OLLAMA_SHA256" ]; then
              echo "Checksum mismatch: expected $OLLAMA_SHA256" >&2
              exit 1
            fi
            echo "Checksum verified against ATLAS_OLLAMA_SHA256."
          else
            echo "No ATLAS_OLLAMA_SHA256 set. Set it to the value above to pin this build."
          fi

          sudo tar -C /usr --zstd -xf "$archive"
          rm -f "$archive"

          # The server's window and the window Atlas declares must be the same
          # number. Ollama defaults to 4096; Atlas would otherwise send a
          # 12,000-token prompt that is silently truncated to its tail, and the
          # model would answer from a fragment with nothing reporting a fault.
          # ATLAS_CODER_CONTEXT_WINDOW feeds both, so they cannot drift.
          export OLLAMA_CONTEXT_LENGTH="${CONTEXT_LENGTH:-16384}"
          echo "Model server context length: $OLLAMA_CONTEXT_LENGTH"
          ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "Model server did not become ready." >&2
            tail -50 "${RUNNER_TEMP}/ollama.log" >&2 || true
            exit 1
          fi

          echo "Pulling $SELF_HOSTED_MODEL (this is several GB and is not cached between runs)."
          ollama pull "$SELF_HOSTED_MODEL"

          # Loopback, so the endpoint validator permits plain http: a request
          # that never leaves the machine has no network to be intercepted on.
          {
            echo "SELF_HOSTED_BASE_URL=http://127.0.0.1:11434/v1"
            echo "SELF_HOSTED_MODEL=${SELF_HOSTED_MODEL}"
          } >> "$GITHUB_ENV"

      - name: Run Atlas task
        env:
          # Both vendor keys are exposed; the runner reads only the one the
          # selected provider needs, and an unset key for the *other* vendor is
          # not an error. Set ATLAS_CODER_PROVIDER to pick explicitly, or leave
          # it empty and let a claude-* ATLAS_CODER_MODEL select Anthropic.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_CODER_PROVIDER: ${{ vars.ATLAS_CODER_PROVIDER }}
          ATLAS_CODER_MODEL: ${{ vars.ATLAS_CODER_MODEL }}
          ATLAS_CODER_FALLBACKS: ${{ vars.ATLAS_CODER_FALLBACKS }}
          ATLAS_CODER_RETRY_ATTEMPTS: ${{ vars.ATLAS_CODER_RETRY_ATTEMPTS }}
          ATLAS_CODER_RETRY_MAX_DELAY_MS: ${{ vars.ATLAS_CODER_RETRY_MAX_DELAY_MS }}
          # Optional stronger model for repairs the configured one could not finish (docs/CODER-PROVIDER-LIMITS.md).
          ATLAS_CODER_ESCALATION: ${{ vars.ATLAS_CODER_ESCALATION }}
          ATLAS_CODER_ESCALATION_ATTEMPTS: ${{ vars.ATLAS_CODER_ESCALATION_ATTEMPTS }}
          ATLAS_TOKEN_BUDGET: ${{ vars.ATLAS_TOKEN_BUDGET }}
          ATLAS_MAX_TURNS: ${{ vars.ATLAS_MAX_TURNS }}
          # Per-step reply ceiling. Groq defaults to 1,024 for its free tier;
          # on a paid tier set 8192 so full-file edits fit in one step.
          ATLAS_OUTPUT_TOKENS_PER_TURN: ${{ vars.ATLAS_OUTPUT_TOKENS_PER_TURN }}
          # Points the OpenAI-compatible client at a self-hosted model server
          # (vLLM, Ollama, llama.cpp, TGI, a rented GPU) instead of Groq. Set
          # it to the base URL ending in /v1. Must be https unless loopback:
          # the prompt carries repository content.
          ATLAS_CODER_BASE_URL: ${{ vars.ATLAS_CODER_BASE_URL }}
          # Both only apply to a self-hosted endpoint; against a vendor the
          # CLI refuses them rather than stating a limit that is not in force.
          ATLAS_CODER_CONTEXT_WINDOW: ${{ vars.ATLAS_CODER_CONTEXT_WINDOW }}
          ATLAS_CODER_MAX_OUTPUT_TOKENS: ${{ vars.ATLAS_CODER_MAX_OUTPUT_TOKENS }}
          # Self-verification: which directory declares the scripts to run
          # (a monorepo usually declares none at its root), and how many
          # repair passes the agent gets when it breaks something.
          ATLAS_VERIFY_DIR: ${{ vars.ATLAS_VERIFY_DIR || 'packages/atlas-cli' }}
          ATLAS_MAX_REPAIR_ATTEMPTS: ${{ vars.ATLAS_MAX_REPAIR_ATTEMPTS }}
        run: |
          set -euo pipefail
          # Resolved in the shell rather than in step env so precedence is
          # explicit: an operator-set variable always wins, and the self-hosted
          # server is only used when nothing else was configured.
          export ATLAS_CODER_BASE_URL="${ATLAS_CODER_BASE_URL:-${SELF_HOSTED_BASE_URL:-}}"
          export ATLAS_CODER_MODEL="${ATLAS_CODER_MODEL:-${SELF_HOSTED_MODEL:-}}"
          if [ -n "$ATLAS_CODER_BASE_URL" ]; then
            echo "Model endpoint: $ATLAS_CODER_BASE_URL (model: $ATLAS_CODER_MODEL)"
            # CPU generation is an order of magnitude slower than a hosted API,
            # so the per-run ceiling has to move with it.
            export ATLAS_CODER_TIMEOUT_MS="${ATLAS_CODER_TIMEOUT_MS:-18000000}"
          fi
          node scripts/runner/run-task.mjs

      - name: Open pull request for coder changes
        env:
          # The default GITHUB_TOKEN can push a branch but is blocked from
          # opening pull requests unless the repository enables "Allow
          # GitHub Actions to create and approve pull requests" — ATLAS_GITHUB_TOKEN
          # (the fine-grained PAT already used to dispatch this workflow)
          # needs its own "Pull requests: Read and write" permission for this.
          GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
        run: node scripts/runner/create-coder-pull-request.mjs

      # always(): a failed run is exactly the one whose verdict is worth
      # putting on the run's front page. The script never exits non-zero, so
      # this step cannot turn a green run red.
      - name: Write run summary
        if: always()
        run: node scripts/runner/run-summary.mjs

      - name: Upload bounded task artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ATLAS_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

  report:
    name: Return results to Atlas
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # A separate job: target repository commands never get an OIDC token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cornerstonemarketingus/atlas
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build trusted credential scanner
        working-directory: packages/atlas-cli
        run: npm ci --ignore-scripts && npm run build
      - name: Download result data
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-${{ github.run_id }}-${{ github.run_attempt }}
          path: atlas-output
      - name: Deliver redacted findings
        env:
          ATLAS_TASK_ID: ${{ inputs.task_id }}
          ATLAS_CORRELATION_ID: ${{ inputs.correlation_id }}
          ATLAS_OUTPUT_DIR: atlas-output
          ATLAS_JOB_RESULT: ${{ needs.run.result }}
          ATLAS_RESULT_URL: ${{ vars.ATLAS_RESULT_URL }}
        run: node scripts/runner/report-result.mjs
