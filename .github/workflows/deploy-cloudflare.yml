name: Deploy Atlas web to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      HAS_GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN != '' }}
      HAS_OPERATOR_TOKEN: ${{ secrets.ATLAS_OPERATOR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        env:
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
          ATLAS_D1_DATABASE_NAME: ${{ secrets.ATLAS_D1_DATABASE_NAME }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Set ATLAS_GITHUB_TOKEN Worker secret
        if: ${{ env.HAS_GITHUB_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
        run: printf '%s' "$ATLAS_GITHUB_TOKEN" | npx wrangler secret put ATLAS_GITHUB_TOKEN --config dist/server/wrangler.json

      - name: Set ATLAS_OPERATOR_TOKEN Worker secret
        if: ${{ env.HAS_OPERATOR_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_OPERATOR_TOKEN: ${{ secrets.ATLAS_OPERATOR_TOKEN }}
        run: printf '%s' "$ATLAS_OPERATOR_TOKEN" | npx wrangler secret put ATLAS_OPERATOR_TOKEN --config dist/server/wrangler.json
