name: Deploy Atlas web to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # The chat's agent team imports the local daemon's team planner.
      - "apps/local-control/src/agent/team/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {}

# Least privilege: the job only checks out code; Cloudflare credentials come
# from repository secrets, never from the workflow token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      HAS_GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN != '' }}
      HAS_OPERATOR_TOKEN: ${{ secrets.ATLAS_OPERATOR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        env:
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
          ATLAS_D1_DATABASE_NAME: ${{ secrets.ATLAS_D1_DATABASE_NAME }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      # Every secret the Worker needs at runtime, uploaded in one pass.
      #
      # This previously uploaded only ATLAS_GITHUB_TOKEN and
      # ATLAS_OPERATOR_TOKEN, which meant sign-in and billing could not work in
      # production no matter what was configured: the session secret, the OAuth
      # client credentials and the Stripe keys were set as *repository* secrets
      # and never reached the Worker. A repository secret is invisible to
      # running code; only `wrangler secret put` makes it readable at runtime.
      #
      # Unset secrets are skipped, not failed: a deployment with Stripe not yet
      # configured should still deploy and simply report billing as
      # unconfigured via /api/setup/status.
      - name: Upload Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dispatch + operator access
          ATLAS_GITHUB_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
          ATLAS_OPERATOR_TOKEN: ${{ secrets.ATLAS_OPERATOR_TOKEN }}
          # Sign-in. Without ATLAS_SESSION_SECRET no session can be issued at
          # all, so GitHub sign-in fails even with valid OAuth credentials.
          ATLAS_SESSION_SECRET: ${{ secrets.ATLAS_SESSION_SECRET }}
          ATLAS_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ATLAS_GITHUB_OAUTH_CLIENT_ID }}
          ATLAS_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.ATLAS_GITHUB_OAUTH_CLIENT_SECRET }}
          # Comma-separated GitHub logins allowed to receive the unrestricted
          # owner role after completing the normal OAuth identity check.
          ATLAS_OWNER_GITHUB_LOGINS: ${{ secrets.ATLAS_OWNER_GITHUB_LOGINS }}
          # Chat. The model endpoint the Chat section talks to. These are
          # separate from the ATLAS_CODER_* repository *variables*, which only
          # ever reach the GitHub Actions runner — a Worker cannot read a
          # repository variable, so Chat stays unconfigured until these are
          # uploaded here. One endpoint can still serve both; it just has to be
          # configured in both places.
          ATLAS_CHAT_BASE_URL: ${{ secrets.ATLAS_CHAT_BASE_URL }}
          ATLAS_CHAT_MODEL: ${{ secrets.ATLAS_CHAT_MODEL }}
          ATLAS_MODEL_API_KEY: ${{ secrets.ATLAS_MODEL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # A second model on the same endpoint, tried when the first is
          # rate-limited ("none" turns it off). The runtime has read this since
          # the fallback was added, but it was never uploaded, so production
          # stopped on every 429 that a fallback would have absorbed.
          ATLAS_CHAT_FALLBACK_MODEL: ${{ secrets.ATLAS_CHAT_FALLBACK_MODEL }}
          # More models on the same endpoint (comma-separated). With the quota
          # ledger bound, each call goes to the first one with capacity.
          ATLAS_CHAT_MODELS: ${{ secrets.ATLAS_CHAT_MODELS }}
          # Chat's web_search tool. Without it the tool reports it is not set up.
          ATLAS_TAVILY_API_KEY: ${{ secrets.ATLAS_TAVILY_API_KEY }}
          # Comma-separated owner/name repositories chat tools and tasks may act
          # on. Read by chat, tasks and settings; unset keeps the built-in default.
          ATLAS_ALLOWED_REPOSITORIES: ${{ secrets.ATLAS_ALLOWED_REPOSITORIES }}
          # Billing
          ATLAS_STRIPE_SECRET_KEY: ${{ secrets.ATLAS_STRIPE_SECRET_KEY }}
          ATLAS_STRIPE_WEBHOOK_SECRET: ${{ secrets.ATLAS_STRIPE_WEBHOOK_SECRET }}
          ATLAS_STRIPE_PRICE_PRO: ${{ secrets.ATLAS_STRIPE_PRICE_PRO }}
          ATLAS_STRIPE_PRICE_TEAM: ${{ secrets.ATLAS_STRIPE_PRICE_TEAM }}
          # Optional: per-customer GitHub App instead of a single PAT
          ATLAS_GITHUB_APP_ID: ${{ secrets.ATLAS_GITHUB_APP_ID }}
          ATLAS_GITHUB_INSTALLATION_ID: ${{ secrets.ATLAS_GITHUB_INSTALLATION_ID }}
          ATLAS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ATLAS_GITHUB_APP_PRIVATE_KEY }}
          ATLAS_GITHUB_APP_SLUG: ${{ secrets.ATLAS_GITHUB_APP_SLUG }}
        run: |
          set -euo pipefail
          # Reuse the existing provider key only for its exact trusted origin.
          # Never send it to a user-configured local/tunnel endpoint.
          if [ -z "${ATLAS_MODEL_API_KEY:-}" ] && [ "${ATLAS_CHAT_BASE_URL%/}" = "https://api.groq.com/openai/v1" ]; then
            export ATLAS_MODEL_API_KEY="$GROQ_API_KEY"
          fi
          uploaded=0
          skipped=""
          for name in \
            ATLAS_GITHUB_TOKEN \
            ATLAS_OPERATOR_TOKEN \
            ATLAS_SESSION_SECRET \
            ATLAS_GITHUB_OAUTH_CLIENT_ID \
            ATLAS_GITHUB_OAUTH_CLIENT_SECRET \
            ATLAS_OWNER_GITHUB_LOGINS \
            ATLAS_CHAT_BASE_URL \
            ATLAS_CHAT_MODEL \
            ATLAS_MODEL_API_KEY \
            ATLAS_CHAT_FALLBACK_MODEL \
            ATLAS_CHAT_MODELS \
            ATLAS_TAVILY_API_KEY \
            ATLAS_ALLOWED_REPOSITORIES \
            ATLAS_STRIPE_SECRET_KEY \
            ATLAS_STRIPE_WEBHOOK_SECRET \
            ATLAS_STRIPE_PRICE_PRO \
            ATLAS_STRIPE_PRICE_TEAM \
            ATLAS_GITHUB_APP_ID \
            ATLAS_GITHUB_INSTALLATION_ID \
            ATLAS_GITHUB_APP_PRIVATE_KEY \
            ATLAS_GITHUB_APP_SLUG
          do
            # Indirect expansion, so the value is never interpolated into the
            # command line where it could reach a process listing or a log.
            value="${!name-}"
            if [ -z "$value" ]; then
              skipped="$skipped $name"
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --config dist/server/wrangler.json
            uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded Worker secret(s)."
          if [ -n "$skipped" ]; then
            echo "Not configured (skipped):$skipped"
          fi

      - name: Report what still needs configuring
        run: |
          echo "Sign-in needs: ATLAS_SESSION_SECRET, ATLAS_GITHUB_OAUTH_CLIENT_ID, ATLAS_GITHUB_OAUTH_CLIENT_SECRET"
          echo "Optional owner login: ATLAS_OWNER_GITHUB_LOGINS"
          echo "Chat needs: ATLAS_CHAT_BASE_URL, ATLAS_CHAT_MODEL (ATLAS_MODEL_API_KEY only if your server authenticates); optional ATLAS_CHAT_FALLBACK_MODEL, ATLAS_CHAT_MODELS, ATLAS_TAVILY_API_KEY"
          echo "Billing needs: ATLAS_STRIPE_SECRET_KEY, ATLAS_STRIPE_WEBHOOK_SECRET, ATLAS_STRIPE_PRICE_PRO, ATLAS_STRIPE_PRICE_TEAM"
          echo "Verify live with: GET /api/setup/status (send your operator token as a Bearer credential)"
