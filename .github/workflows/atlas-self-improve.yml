name: Atlas self-improvement

# Atlas improving Atlas, once a day.
#
# SAFETY POSTURE — read before changing anything here.
#
# This is an autonomous agent with write access to its own source. Three rules
# make that safe rather than reckless, and none of them is optional:
#
#  1. merge_policy is fixed at "manual" in build-dispatch.py and is
#     deliberately NOT a dispatch input, because an input is a thing someone
#     flips "just this once". A self-modifying loop that can merge its own
#     changes can disable its own safety rails and then keep running with them
#     disabled. Every change it proposes waits for a human.
#  2. It stops when review work is already queued. Without this a daily job
#     quietly becomes a pull-request firehose, and unreviewed PRs from an
#     autonomous agent are worse than no agent at all.
#  3. The coder agent's own self-verification still applies: it runs the
#     repository's checks before and after its edit, and a change that
#     introduces a failure is reported as regressed rather than proposed as if
#     it were fine.
#
# The objective lives in .github/atlas/self-improve-objective.md, so tuning
# what the agent works on is an ordinary reviewable diff, not a workflow edit.

on:
  schedule:
    # The owner is in Minnesota (America/Chicago). GitHub cron is UTC and has
    # no daylight-saving awareness, so no single expression holds 4am local
    # all year:
    #
    #   "0 9  * * *"  ->  04:00 CDT (summer, in effect now) / 03:00 CST (winter)
    #   "0 10 * * *"  ->  05:00 CDT (summer)                / 04:00 CST (winter)
    #
    # Run at both possible UTC offsets, then gate on 04:00 America/Chicago.
    # This follows daylight saving time without a manual March/November edit.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      objective:
        description: Override the objective for this run (blank = use the committed objective)
        required: false
        type: string
      max_open_pull_requests:
        description: Skip the run when at least this many pull requests are already open
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-self-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the 4am Chicago schedule
        id: schedule
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          local = datetime.now(timezone.utc).astimezone(ZoneInfo("America/Chicago"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if local.hour == 4 else 'false'}\n")
          print(f"Chicago local time: {local.isoformat()}")
          PY

      - name: Stop if review work is already queued
        id: guard
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
          # Low on purpose. The bottleneck on self-improvement is human review,
          # not generation, so the queue depth that matters is how many pull
          # requests a person will actually look at.
          MAX_OPEN: ${{ github.event.inputs.max_open_pull_requests || '3' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$MAX_OPEN" in
            ''|*[!0-9]*) echo "max_open_pull_requests must be a whole number." >&2; exit 1 ;;
          esac
          curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls?state=open&per_page=100" \
            -o open-pulls.json
          open_count=$(python3 -c 'import json; print(sum(1 for pr in json.load(open("open-pulls.json", encoding="utf-8")) if pr.get("head", {}).get("ref", "").startswith("atlas/task-")))')
          echo "Atlas review pull requests: $open_count (limit $MAX_OPEN)"
          python3 -c 'import json; [print("- #{}: {} ({})".format(pr["number"], pr["html_url"], pr["head"]["ref"])) for pr in json.load(open("open-pulls.json", encoding="utf-8")) if pr.get("head", {}).get("ref", "").startswith("atlas/task-")]' >> "$GITHUB_STEP_SUMMARY"
          if [ "$open_count" -ge "$MAX_OPEN" ]; then
            echo "Skipping: $open_count pull request(s) already awaiting review."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the coder agent at this repository
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ATLAS_GITHUB_TOKEN }}
          OBJECTIVE_OVERRIDE: ${{ github.event.inputs.objective }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/atlas/build-dispatch.py > payload.json
          # --fail-with-body, not --fail: a bare "curl: (22)" says a request
          # failed and nothing about why, which is how four consecutive
          # scheduled runs died without ever naming the missing permission.
          status=0
          body=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/atlas-coder.yml/dispatches" \
            -d @payload.json) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "Dispatch failed (curl exit $status). GitHub said:" >&2
            echo "${body:-<empty response body>}" >&2
            case "$body" in
              *"Resource not accessible"*|*"Bad credentials"*|*"Must have admin"*|*"Not Found"*)
                echo "" >&2
                echo "ATLAS_GITHUB_TOKEN cannot dispatch workflows in $REPOSITORY." >&2
                echo "Grant it 'Actions: Read and write' (fine-grained PAT:" >&2
                echo "https://github.com/settings/tokens?type=beta). Reading pull" >&2
                echo "requests, which the guard step above does, needs a weaker" >&2
                echo "permission than dispatching, so a token can pass the guard" >&2
                echo "and still fail here." >&2
                ;;
            esac
            exit "$status"
          fi
          echo "Dispatched. The agent opens a pull request for review; nothing merges on its own."

      - name: Report a skipped run
        if: ${{ always() && steps.guard.outputs.should_run == 'false' }}
        run: |
          echo "No dispatch: the review queue is already at its limit."

      - name: Report the daylight-saving gate
        if: ${{ github.event_name == 'schedule' && steps.schedule.outputs.should_run != 'true' }}
        run: |
          echo "No dispatch: this UTC slot is not 4am in America/Chicago today."
