name: CI

# The repository had no CI that ran its own tests. The only check on a pull
# request was a Vercel deployment status, so 428 tests could go red without
# anything saying so — and the "ci-gated" merge policy had almost nothing to
# gate on.
#
# That matters most for the daily self-improvement run: an autonomous agent
# proposing changes into a repository with no independent test gate is trusting
# its own self-verification twice over. This is the second opinion.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per ref, so a new push supersedes an in-flight run for the same branch but
  # never cancels main's.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cli:
    name: atlas-cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/atlas-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/atlas-cli/package-lock.json

      # --ignore-scripts: dependency install must not run arbitrary lifecycle
      # scripts, matching how atlas-coder.yml already installs this package.
      - run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  web:
    name: apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` builds first, so this covers the production build too — the
      # same build the Cloudflare deploy runs.
      - name: Build and test
        run: npm test

  runner-scripts:
    name: runner scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/runner carries its own tests and, until now, nothing ran them:
      # there is no root package.json, and the other jobs are scoped to
      # packages/atlas-cli and apps/web. A test that never executes asserts a
      # confidence it has not earned.
      - name: Test runner scripts
        run: node --test scripts/runner/*.test.mjs

  workflows:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # GitHub parses a workflow before it will run anything, and a file it
      # rejects fails with zero jobs and no useful message. That has cost this
      # repository three silent failures, including this very job's first
      # version — so the checks live in a script that can also be run by hand
      # before pushing, and the workflow only calls it.
      - name: Check every workflow
        run: python3 .github/atlas/check-workflows.py
