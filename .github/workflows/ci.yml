name: CI

# The repository had no CI that ran its own tests. The only check on a pull
# request was a Vercel deployment status, so 428 tests could go red without
# anything saying so — and the "ci-gated" merge policy had almost nothing to
# gate on.
#
# That matters most for the daily self-improvement run: an autonomous agent
# proposing changes into a repository with no independent test gate is trusting
# its own self-verification twice over. This is the second opinion.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per ref, so a new push supersedes an in-flight run for the same branch but
  # never cancels main's.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cli:
    name: atlas-cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/atlas-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/atlas-cli/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            packages/atlas-cli/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-atlas-cli-deps-${{ hashFiles('packages/atlas-cli/package-lock.json') }}
          restore-keys: ${{ runner.os }}-atlas-cli-deps-

      # --ignore-scripts: dependency install must not run arbitrary lifecycle
      # scripts, matching how atlas-coder.yml already installs this package.
      - run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  web:
    name: apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-apps-web-deps-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-apps-web-deps-

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` builds first, so this covers the production build too — the
      # same build the Cloudflare deploy runs.
      - name: Build and test
        run: npm test

  local-control:
    name: apps/local-control
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local-control
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This package deliberately has no third-party dependencies: the local
      # control plane must remain installable without an npm registry. Its
      # SQLite, HTTP, crypto, and test support come from the pinned Node runtime.
      - name: Test sovereign control plane
        run: npm test

      # The owner journey against a real daemon process: plan, delegate,
      # authorized tools, approvals, pause/resume/cancel, and recovery after
      # the daemon is killed mid-step. The model is scripted.
      - name: End-to-end journey
        run: npm run e2e

  local-control-windows:
    name: apps/local-control (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/local-control
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exercise the restricted terminal controller, MCP environment handling,
      # and daemon tests on the desktop OS Atlas users actually run.
      - name: Test local control on Windows
        run: npm test

  contracts:
    name: packages/atlas-contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/atlas-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The contracts are shared by every plane and carry no dependencies, so
      # there is nothing to install: a contract that needs a library to be
      # read is one two planes can disagree about.
      - name: Test platform contracts
        run: npm test

  browser-worker:
    name: apps/browser-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/browser-worker/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            apps/browser-worker/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-browser-worker-deps-${{ hashFiles('apps/browser-worker/package-lock.json') }}
          restore-keys: ${{ runner.os }}-browser-worker-deps-

      - run: npm ci --ignore-scripts

      # The worker drives a real Chromium against a local fixture site; the
      # browser is fetched explicitly rather than by an install script.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Test browser worker
        run: npm test

  windows-companion:
    name: apps/windows-companion
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows-companion/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            apps/windows-companion/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-windows-companion-deps-${{ hashFiles('apps/windows-companion/package-lock.json') }}
          restore-keys: ${{ runner.os }}-windows-companion-deps-

      # Browser automation is a security boundary. Exercise the companion on
      # Windows—the platform customers run—on every pull request, rather than
      # discovering policy or packaging regressions only during a release.
      - run: npm ci --ignore-scripts

      - name: Check and test Windows companion
        run: npm run check && npm test

  mobile-shell:
    name: mobile shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The native projects need Xcode and Android Studio, which CI does not
      # have. What CI can and must check is the logic that decides where a
      # credential is stored, whether a deep link is trusted, and what a push
      # payload may carry -- the parts where a mistake is a security bug
      # rather than a build failure.
      - name: Check shell sources
        run: npm run check

      - name: Test the shell
        run: npm test

  windows-release:
    name: Windows release tooling
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The MSI itself needs the WiX toolset and is built on a tag, but
      # everything that proves what is in a release must be exercised on every
      # change -- an unverified release pipeline is one that breaks on the day
      # it is needed.
      - name: Report prerequisites on a clean runner
        run: node scripts/windows/report-requirements.mjs

      - name: Generate checksums, SBOM and a signed update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/ci-artifacts -Force | Out-Null
          Set-Content -Path dist/ci-artifacts/Atlas-0.0.0.msi -Value "not a real installer"
          node -e "const {generateKeyPairSync}=require('node:crypto');const {writeFileSync}=require('node:fs');writeFileSync('dist/ci-key.pem',generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'}))"
          node scripts/release/make-release.mjs --version 0.0.0 --artifacts dist/ci-artifacts --out dist/ci-out --rollback-to 0.0.0 --signing-key dist/ci-key.pem
          if (-not (Test-Path dist/ci-out/SHA256SUMS.txt)) { throw "No checksum file was produced." }
          if (-not (Test-Path dist/ci-out/update-manifest.json)) { throw "No update manifest was produced." }

      - name: Verify the generated manifest is trusted and refuses a downgrade
        shell: pwsh
        run: node scripts/release/verify-release.mjs --manifest dist/ci-out/update-manifest.json --key dist/ci-key.pem --artifacts dist/ci-artifacts

  runner-scripts:
    name: runner scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/runner carries its own tests and, until now, nothing ran them:
      # there is no root package.json, and the other jobs are scoped to
      # packages/atlas-cli and apps/web. A test that never executes asserts a
      # confidence it has not earned.
      - name: Test runner scripts
        run: node --test scripts/runner/*.test.mjs scripts/local/*.test.mjs

  workflows:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # GitHub parses a workflow before it will run anything, and a file it
      # rejects fails with zero jobs and no useful message. That has cost this
      # repository three silent failures, including this very job's first
      # version — so the checks live in a script that can also be run by hand
      # before pushing, and the workflow only calls it.
      - name: Check every workflow
        run: python3 .github/atlas/check-workflows.py
