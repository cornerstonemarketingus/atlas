name: Native mobile build validation
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug compile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Synchronize pinned native plugins
        run: npx --no-install cap sync android
      - name: Install matching Android build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile debug app without release credentials
        run: |
          set -euo pipefail
          bash android/gradlew -p android --no-daemon assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
  ios:
    name: iOS simulator compile
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify selected Apple toolchain
        run: xcodebuild -version
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Synchronize plugins and install local pods
        run: npx --no-install cap sync ios
      - name: Compile simulator app without signing
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          test -d build/ios/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/atlas-ios-simulator.zip
      - name: Launch the compiled app in an available iPhone simulator
        timeout-minutes: 8
        run: node scripts/ios-launch-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-ios-launch-evidence
          path: mobile/build/ios-launch
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ios-simulator
          path: mobile/build/atlas-ios-simulator.zip
          if-no-files-found: error
          retention-days: 3
