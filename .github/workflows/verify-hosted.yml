name: Verify hosted Atlas
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Feature to verify (coder opens a small documentation PR)
        required: true
        default: inspect
        type: choice
        options: [inspect, coder, chat]
      provider:
        description: Chat provider to verify (OpenAI incurs API charges)
        required: false
        default: auto
        type: choice
        options: [auto, configured, openai]
      message:
        description: Chat only. The conversation to verify (for the release gate, the one that failed in production). Runs streaming and non-streaming.
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify authenticated product flow
        env:
          ATLAS_OPERATOR_TOKEN: ${{ secrets.ATLAS_OPERATOR_TOKEN }}
          ATLAS_SMOKE_MODE: ${{ inputs.mode }}
          # Passed through the environment, never interpolated into the script.
          ATLAS_SMOKE_CHAT_MESSAGE: ${{ inputs.message }}
          ATLAS_SMOKE_CHAT_PROVIDER: ${{ inputs.provider }}
        run: node scripts/runner/smoke-hosted.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-smoke-evidence
          path: smoke-result.json
          if-no-files-found: ignore
          retention-days: 7
